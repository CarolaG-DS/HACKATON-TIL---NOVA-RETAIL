version: 2

models:

  - name: fct_sales
    description: "Gold fact table at order level."

    columns:

      - name: order_id
        description: "Unique sales order identifier."
        tests:
          - not_null
          - unique

      - name: product_id
        description: "Product identifier."
        tests:
          - not_null

      - name: quantity
        description: "Absolute quantity sold. Returns are flagged separately."
        tests:
          - not_null

      - name: unit_price
        description: "Unit price in the original transaction currency."
        tests:
          - not_null

      - name: discount_percentage
        description: "Normalized discount expressed as a decimal between 0 and 1."
        tests:
          - not_null

      - name: currency_code
        description: "Original transaction currency."
        tests:
          - accepted_values:
              arguments:
                values:
                  - USD
                  - EUR
                  - GBP

      - name: net_revenue
        description: "Net revenue after discount, with returns represented as negative revenue."
        tests:
          - not_null


  - name: fct_monthly_performance
    description: "Monthly Gold performance aggregated by month and product category."

    columns:

      - name: month
        description: "First day of the reporting month."
        tests:
          - not_null

      - name: product_category
        description: "Product category used for monthly aggregation."
        tests:
          - not_null

      - name: orders
        description: "Distinct number of orders in the month and product category."
        tests:
          - not_null

      - name: revenue_eur
        description: "Total net revenue converted to EUR."
        tests:
          - not_null

      - name: profit_eur
        description: "Profit calculated as 30% of revenue."
        tests:
          - not_null

      - name: aov_eur
        description: "Average order value calculated as revenue divided by distinct orders."
        tests:
          - not_null