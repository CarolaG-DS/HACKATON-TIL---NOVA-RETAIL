version: 2

models:
  - name: fct_sales
    description: "Tabella delle transazioni di vendita normalizzate in EUR"
    columns:
      - name: order_id
        description: "ID univoco dell'ordine"
        tests:
          - not_null
      - name: transaction_date
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: region
        tests:
          - not_null
      - name: unit_price
        tests:
          - not_null
      - name: gross_revenue
        tests:
          - not_null
      - name: net_revenue
        tests:
          - not_null

  - name: dim_customers
    description: "Anagrafica clienti con paese integrato da web reviews"
    columns:
      - name: customer_id
        description: "Chiave primaria cliente (MD5)"
        tests:
          - unique
          - not_null

  - name: fct_monthly_performance
    description: "Confronto mensile Actual vs Target Revenue per Categoria e Region"
    columns:
      - name: performance_month
        tests:
          - not_null
      - name: product_category
        tests:
          - not_null
      - name: region
        tests:
          - not_null
      - name: actual_revenue
        tests:
          - not_null
      - name: target_revenue
        tests:
          - not_null