version: 2

models:
  - name: fct_sales
    description: "Fact table per le transazioni di vendita"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: region
        tests:
          - not_null  # Garantisce che non ci siano region nulle dopo la JOIN
      - name: net_revenue
        tests:
          - not_null

  - name: fct_monthly_performance
    description: "Fact table per i target finanziari e actuals"
    columns:
      - name: performance_month
        tests:
          - not_null
      - name: region
        tests:
          - not_null
      - name: product_category
        tests:
          - not_null